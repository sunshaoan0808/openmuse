# 顶栏 / 水豚：用户三次反馈的那三个现象，用真机级判据钉住
# 运行前提：App 处于已登录态（CI 用 repo secret OPENMUSE_TEST_TOKEN）
# TODO(待补)：App.tsx 给顶栏菜单按钮与头像胶囊加 testID（topbar-menu / topbar-mascot），
#             然后把下面的 text 匹配换成 id 匹配 —— Android 上 testID 会变成 resource-id，最稳。
#             目前先用文案/无障碍名近似匹配。
appId: app.openmuse.mobile
---
# 这个文件既被 smoke.yaml 当子流程 runFlow 调用，也会被 `maestro test .maestro/` **单独**当成一条 flow 跑。
# 单独跑时必须自己把 App 拉起来 —— 否则断言是对着桌面（Launcher）做的：
# 真事，2026-10-03 的 run 里 topbar 单跑就是这样挂的（失败层级里写的是
# accessibilityText=Apps list / Search / Gallery / Phone …，那是桌面，不是我们的界面）。
# 而 smoke 里内联跑的那次是 COMPLETED —— 顶栏与 4 条判据在真机上是过的。
- launchApp
- waitForAnimationToEnd
- assertVisible:
    id: ".*"
    optional: true

# ① 顶栏存在
# 注意：按钮的无障碍名是「打开会话与菜单」（App.tsx 的 label），Maestro 的 text 是**整串正则匹配**，
# 所以必须用 .* 包住；写成裸 "会话与菜单" 会永远匹配不到（这条以前从没真跑过，一直没暴露）。
- assertVisible:
    text: ".*会话与菜单.*"
    optional: false

# ② 慢滑 2 秒（用户报的场景：慢速滑动）
- swipe:
    direction: UP
    duration: 2000
- waitForAnimationToEnd

# ③ 水豚卡片：滑出后仍可见（对应"保留"，不随滚动隐藏）
- assertVisible:
    text: ".*Open.*"
    optional: true

# ④ 水豚卡片在最前端 —— 可点性就是层级判据：
#    若被正文覆盖，这一下点不到，flow 直接失败（等价于我们在 Web 上用 elementFromPoint 的手工验证）
- tapOn:
    text: ".*Open.*"
    optional: false
